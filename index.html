<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔罗占卜 · 牌阵抽牌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;
  color:#6b5e63;
  background-color:#faf6f2;
  background-image:radial-gradient(circle,rgba(200,168,184,.22) 2.5px,transparent 2.5px);
  background-size:30px 30px;
  min-height:100vh;padding:36px 16px 60px;
}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:22px;font-weight:600;color:#8a6675;letter-spacing:2px;text-align:center}
.sub{font-size:13px;color:#a89a9f;text-align:center;margin-top:8px;letter-spacing:1px}
.screen{display:none;margin-top:26px}
.screen.active{display:block}
.card{
  background:rgba(255,255,255,.84);
  border:1px solid rgba(214,194,204,.55);
  border-radius:18px;padding:26px 24px;margin-bottom:18px;
}
.spread{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:rgba(255,255,255,.84);
  border:1px solid rgba(214,194,204,.55);
  border-radius:16px;padding:18px 20px;margin-bottom:14px;
  transition:.2s;font-family:inherit;
}
.spread:hover{border-color:#c8a8b8;background:#fff;transform:translateY(-1px)}
.spread .name{font-size:16px;color:#8a6675;font-weight:600;letter-spacing:1px}
.spread .count{font-size:12px;color:#fff;background:#c8a8b8;border-radius:999px;padding:2px 10px;margin-left:8px}
.spread .desc{font-size:13px;color:#7a6670;margin-top:8px;line-height:1.6}
.spread .meta{font-size:12px;color:#a89a9f;margin-top:8px;line-height:1.6}
.actions{text-align:center;margin-top:18px}
button{font-family:inherit;font-size:14px;cursor:pointer;border:none;border-radius:12px;padding:12px 28px;letter-spacing:1px}
.btn-main{background:#c8a8b8;color:#fff}
.btn-main:hover{background:#b898a8}
.btn-main:disabled{background:#dcccd4;cursor:not-allowed}
.btn-ghost{background:transparent;color:#a57f8f;border:1px solid #d8c4cc;margin-left:8px}
.btn-ghost:hover{background:#fff}
.question{width:100%;font-family:inherit;font-size:14px;color:#7a6670;border:1px solid #d8c4cc;border-radius:12px;padding:14px;background:rgba(255,255,255,.9);outline:none;resize:vertical;min-height:70px}
.question:focus{border-color:#c8a8b8}
.hint{font-size:12px;color:#b8a4ac;margin-top:8px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-top:6px}
.cardback{
  aspect-ratio:2/3;border-radius:8px;cursor:pointer;position:relative;
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.55) 0 5%, transparent 6%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 5px, transparent 5px 10px),
    linear-gradient(160deg,#d8c4cc,#b89aa8);
  border:1.5px solid #c8a8b8;
  box-shadow:0 1px 4px rgba(140,110,125,.15);
  transition:.12s;
}
.cardback::after{content:"✦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);font-size:15px}
.cardback:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(140,110,125,.25)}
.cardback.picked{border-color:#7a5568;background:linear-gradient(160deg,#a8809a,#6b4f5e)}
.cardback.picked::after{content:"✓";color:#fff}
.cardback.disabled{opacity:.3;cursor:default;transform:none;box-shadow:none}

/* 牌的正面 */
.cardface{
  width:74px;flex:0 0 74px;aspect-ratio:2/3;
  background:linear-gradient(160deg,#fffdfa,#f2e6ea);
  border:2px solid #c8a8b8;border-radius:9px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:6px 4px;color:#8a6675;box-shadow:0 2px 6px rgba(140,110,125,.18);
  position:relative;
}
.cardface::before{content:"";position:absolute;inset:3px;border:1px solid rgba(200,168,184,.45);border-radius:6px;pointer-events:none}
.cardface.reversed{transform:rotate(180deg)}
.cf-num{font-size:9px;color:#b08a9a;letter-spacing:1px}
.cf-sym{font-size:22px;line-height:1}
.cf-nm{font-size:9px;text-align:center;line-height:1.25}

.reading-card{display:flex;gap:14px;align-items:flex-start;background:rgba(255,255,255,.72);border:1px solid #ecdce4;border-radius:14px;padding:16px;margin-bottom:12px}
.reading-card .body{flex:1}
.reading-card .pos{font-size:12px;color:#b08a9a;font-weight:600;letter-spacing:1px}
.reading-card .cn{font-size:15px;color:#8a6675;font-weight:600;margin-left:8px}
.ori{font-size:11px;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.ori.up{background:#dfead9;color:#6f8a63}
.ori.rev{background:#f2dde0;color:#a5737c}
.tags{margin-top:8px}
.tag{display:inline-block;font-size:11px;color:#a57f8f;background:rgba(242,230,234,.7);border-radius:999px;padding:2px 9px;margin:2px 4px 2px 0}
.mean{font-size:13px;color:#6f6367;line-height:1.85;margin-top:8px}
.ask{font-size:12px;color:#b08a9a;margin-top:7px;line-height:1.6}
.tie{font-size:12.5px;color:#7a6670;background:rgba(223,234,217,.45);border-left:3px solid #c8a8b8;border-radius:6px;padding:9px 11px;margin-top:10px;line-height:1.85}
.tie b{color:#8a6675}
.meta2{font-size:11px;color:#bcacb2;margin-top:9px;letter-spacing:.5px}
.chain{font-size:12.5px;color:#6f6367;line-height:2;margin-top:2px}
.chain b{color:#8a6675}
.summary h3{margin-top:16px}
.summary h3:first-child{margin-top:0}
.overview{background:rgba(223,234,217,.5);border:1px solid #d8e3d3;border-radius:12px;padding:12px 14px;font-size:13px;color:#6f6367;line-height:1.85;margin-bottom:10px}
.overview b{color:#7a8f70}
.hintline{font-size:11.5px;color:#b8a4ac;margin-bottom:16px;line-height:1.6}
.domains-title{font-size:13px;color:#8a6675;font-weight:600;margin:18px 0 4px}
.domain{background:rgba(255,255,255,.6);border:1px solid #ecdce4;border-radius:10px;padding:12px 14px;margin-top:10px;font-size:12.5px;color:#6f6367;line-height:1.85}
.dk{font-size:13px;color:#8a6675;font-weight:600;margin-bottom:5px}

.summary{background:rgba(242,230,234,.5);border:1px solid #ecdce4;border-radius:14px;padding:18px;font-size:13px;color:#6f6367;line-height:1.95}
.summary h3{font-size:14px;color:#8a6675;margin-bottom:10px;font-weight:600}
.q-display{font-size:13px;color:#a89a9f;text-align:center;margin-bottom:14px;font-style:italic;line-height:1.7}
.reveal-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.tipbox{font-size:12px;color:#a89a9f;line-height:1.8}
.footer{text-align:center;font-size:11px;color:#c4b0b6;margin-top:30px;line-height:1.8}
.countbar{font-size:13px;color:#8a6675;font-weight:600;margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>✦ 塔罗占卜 ✦</h1>
  <div class="sub">静下心来，选一个牌阵，然后抽牌</div>

  <section id="screen-spread" class="screen active"><div id="spreadList"></div></section>

  <section id="screen-question" class="screen">
    <div class="card">
      <div id="qSpreadName" style="font-size:15px;color:#8a6675;font-weight:600;margin-bottom:14px"></div>
      <textarea id="question" class="question" placeholder="（可选）写下你此刻的问题，比如：我该不该换工作？&#10;写下来能让解读更聚焦。"></textarea>
      <div class="hint">提示：用开放式问题效果最好（"我该如何……"），避免"是/否"式提问。</div>
    </div>
    <div class="actions">
      <button class="btn-main" onclick="startShuffle()">开始洗牌</button>
      <button class="btn-ghost" onclick="go('screen-spread')">重选牌阵</button>
    </div>
  </section>

  <section id="screen-pick" class="screen">
    <div class="card">
      <div id="qDisplay" class="q-display"></div>
      <div class="countbar">请凭直觉点选 <span id="needCount">3</span> 张牌</div>
      <div class="hint" style="margin-bottom:14px">已选 <b id="pickedCount">0</b> 张 · 牌已打乱，正逆位随机</div>
      <div id="cardGrid" class="grid"></div>
    </div>
    <div class="actions">
      <button id="revealBtn" class="btn-main" disabled onclick="reveal()">展开解读</button>
      <button class="btn-ghost" onclick="go('screen-question')">上一步</button>
    </div>
  </section>

  <section id="screen-reading" class="screen">
    <div class="card">
      <div id="qDisplay2" class="q-display"></div>
      <div id="revealRow" class="reveal-row"></div>
      <div id="readingList"></div>
    </div>
    <div id="summaryBox"></div>
    <div class="actions">
      <button class="btn-main" onclick="restart()">再抽一次</button>
      <button class="btn-ghost" onclick="go('screen-spread')">换个牌阵</button>
    </div>
  </section>

  <div class="footer">塔罗是一种自我探索的工具，不是为了替你决定人生 ✦<br>请把它当作一面镜子，而非预言</div>
</div>

 ['骑士','稳健/可靠/坚持','停滞/固执',
  '稳健可靠、有始有终，你一步一脚印，令人放心。',
  '停滞不前或过于固执保守，错过了变化的机会。'],
 ['王后','务实/滋养/丰盛','忽视自我/失衡',
  '务实又滋养，你能把生活和事业都照料得井井有条。',
  '忙于照顾一切却忽略了自己，身心失衡。'],
 ['国王','富足/成功/稳定','贪婪/物质主义',
  '物质上的成功与稳定，你有能力创造并守护财富。',
  '贪婪、物质至上，或用金钱衡量一切。']
]
};

const SUIT_SYM = {'圣杯':'🍷','权杖':'🔥','宝剑':'⚔️','星币':'🪙'};
const SUIT_THEME = {'圣杯':'情感与关系','权杖':'行动与热情','宝剑':'想法与沟通','星币':'现实与物质'};
const SUIT_ELEM = {'圣杯':'水','权杖':'火','宝剑':'风','星币':'土'};

/* ============ 状态 ============ */
let deck=[], spread=null, picked=[], pool=[];

function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildDeck(){
  const d=[];
  MAJORS.forEach(m=>d.push({name:m[0],short:m[0],type:'major',num:m[1],sym:m[2],ku:m[3],kr:m[4],up:m[5],rev:m[6]}));
  for(const s in MINOR){
    MINOR[s].forEach(r=>d.push({name:s+r[0],short:s+r[0],type:'minor',suit:s,num:'',sym:SUIT_SYM[s],ku:r[1],kr:r[2],up:r[3],rev:r[4]}));
  }
  return d;
}

function renderSpreads(){
  const box=document.getElementById('spreadList'); box.innerHTML='';
  SPREADS.forEach(s=>{
    const b=document.createElement('button');
    b.className='spread';
    b.innerHTML=`<div><span class="name">${s.name}</span><span class="count">${s.cards}张</span></div>
      <div class="desc">${s.desc}</div>
      <div class="meta">✅ 适合：${s.good}<br>🚫 不适合：${s.bad}</div>`;
    b.onclick=()=>{spread=s;document.getElementById('qSpreadName').textContent='牌阵：'+s.name+'（'+s.cards+'张）';go('screen-question');};
    box.appendChild(b);
  });
}

function startShuffle(){
  deck=buildDeck();
  shuffle(deck);
  pool=deck.map((c,i)=>({card:c,reversed:Math.random()<0.5,id:i}));
  shuffle(pool); // 再打乱位置
  picked=[];
  document.getElementById('needCount').textContent=spread.cards;
  document.getElementById('pickedCount').textContent='0';
  const q=document.getElementById('question').value.trim();
  document.getElementById('qDisplay').textContent=q?('你的问题：'+q):'（未写问题，凭直觉抽牌即可）';
  renderGrid();
  document.getElementById('revealBtn').disabled=true;
  go('screen-pick');
}

function renderGrid(){
  const grid=document.getElementById('cardGrid'); grid.innerHTML='';
  pool.forEach(p=>{
    const d=document.createElement('div');
    d.className='cardback';
    d.dataset.id=p.id;
    d.onclick=()=>pickCard(p.id,d);
    grid.appendChild(d);
  });
}

function pickCard(id,el){
  if(picked.includes(id)){picked=picked.filter(x=>x!==id);el.classList.remove('picked');}
  else{if(picked.length>=spread.cards)return;picked.push(id);el.classList.add('picked');}
  document.getElementById('pickedCount').textContent=picked.length;
  document.getElementById('revealBtn').disabled=(picked.length!==spread.cards);
}

function faceHTML(c,rev){
  return `<div class="cardface ${rev?'reversed':''}">
    <div class="cf-num">${c.num||''}</div>
    <div class="cf-sym">${c.sym}</div>
    <div class="cf-nm">${c.short}</div>
  </div>`;
}

/* 一句话总览：用人话概括这次整体感觉 */
function overviewText(chosen){
  let revs=0,majors=0; const suits={};
  chosen.forEach(p=>{if(p.reversed)revs++;if(p.card.type==='major')majors++;if(p.card.suit)suits[p.card.suit]=(suits[p.card.suit]||0)+1;});
  let s='';
  s += (revs>chosen.length/2)?'整体感觉有点"卡"，事情不会太顺，重点是要先调整自己的心态和做法。'
     : (revs===0?'整体感觉挺顺，你可以放心往前推进。'
     : '有顺有阻，是"正常发挥、需要一点耐心"的局面。');
  if(majors>=Math.ceil(chosen.length/2)) s+=' 你抽到的"重量级"牌偏多，说明这件事对你很重要，不是随便问问。';
  const top=Object.entries(suits).sort((a,b)=>b[1]-a[1])[0];
  if(top&&top[1]>=2) s+=' 牌面集中在「'+SUIT_THEME[top[0]]+'」，这次的重点就在这儿。';
  return s;
}

/* 分方面解读：学业 / 事业 / 感情 / 生活 */
function domainsHTML(chosen){
  const D=[
    {k:'📚 学业 / 学习', intro:'学习上，重点看"思考与积累"。', suits:['宝剑','星币']},
    {k:'💼 事业 / 工作', intro:'事业上，重点看"行动与成果"。', suits:['权杖','星币']},
    {k:'💗 感情 / 人际', intro:'感情上，重点看"感受与心动"。', suits:['圣杯','权杖']},
    {k:'🌱 生活 / 健康', intro:'生活上，重点看"安心与踏实"。', suits:['星币','圣杯']}
  ];
  let h='';
  D.forEach(d=>{
    const rel=chosen.filter(p=>p.card.type==='major'||d.suits.includes(p.card.suit));
    let body;
    if(rel.length===0){ body='这次牌面没有特别指向这一块，先放一放，别多想。'; }
    else{
      body = rel.map(p=>{
        const kw=(p.reversed?p.card.kr:p.card.ku).split('/')[0].trim();
        return '「'+p.card.short+'」提示：'+kw;
      }).join('；')+'。';
      const revN=rel.filter(p=>p.reversed).length;
      body += (revN*2>rel.length) ? ' 这块眼下不太顺，别硬来，先把基础理顺。' : ' 这块目前比较顺，可以顺势推进。';
    }
    h += '<div class="domain"><div class="dk">'+d.k+'</div><div>'+d.intro+body+'</div></div>';
  });
  return h;
}

function reveal(){
  const chosen=picked.map(id=>pool.find(p=>p.id===id));
  document.querySelectorAll('.overview,.hintline,.domains-title,.domain').forEach(e=>e.remove());
  const row=document.getElementById('revealRow'); row.innerHTML='';
  const list=document.getElementById('readingList'); list.innerHTML='';
  let majors=0,revs=0; const suitCount={};
  let chain='';

  chosen.forEach((p,i)=>{
    const c=p.card, isRev=p.reversed;
    const pos=spread.positions[i]||{label:'第'+(i+1)+'张',ask:'',tie:''};
    if(c.type==='major')majors++;
    if(isRev)revs++;
    if(c.suit)suitCount[c.suit]=(suitCount[c.suit]||0)+1;

    row.insertAdjacentHTML('beforeend',faceHTML(c,isRev));

    const kws=(isRev?c.kr:c.ku).split('/');
    const meaning=isRev?c.rev:c.up;
    const meta=c.type==='major'
      ? '这是一张分量很重的"关键牌"'
      : '这是一张和「'+SUIT_THEME[c.suit]+'」有关的牌';

    chain += '· <b>【'+pos.label+'】</b> '+c.short+'（'+(isRev?'逆位':'正位')+'）—— '+kws.slice(0,3).map(k=>k.trim()).join('、')+'<br>';

    const div=document.createElement('div');
    div.className='reading-card';
    div.innerHTML=`
      ${faceHTML(c,isRev)}
      <div class="body">
        <div><span class="pos">【${pos.label}】</span>
        <span class="cn">${c.name}</span>
        <span class="ori ${isRev?'rev':'up'}">${isRev?'逆位':'正位'}</span></div>
        <div class="ask">▸ 这一位在问：${pos.ask}</div>
        <div class="tags">${kws.map(k=>'<span class="tag">'+k.trim()+'</span>').join('')}</div>
        <div class="mean">${meaning}</div>
        <div class="tie">✦ <b>放回牌阵里看</b>：${c.short}${isRev?'（逆位）':'（正位）'}出现在「${pos.label}」位——${pos.tie}</div>
        <div class="meta2">${meta}</div>
      </div>`;
    list.appendChild(div);
  });

  // 一句话总览 + 正逆位说明
  row.insertAdjacentHTML('beforebegin',
    '<div class="overview"><b>一句话总览：</b>'+overviewText(chosen)+'</div>'+
    '<div class="hintline">小提示：<b>正位</b>＝顺利、正面的能量；<b>逆位</b>＝受阻、需要留意的地方。</div>');

  // 分方面解读
  list.insertAdjacentHTML('afterend',
    '<div class="domains-title">✦ 分方面看看（哪块有感觉就看哪块，不必全信）</div>'+domainsHTML(chosen));

  const tips=[];
  if(majors>=Math.ceil(chosen.length/2)) tips.push('<b>重量级牌偏多</b>：这件事对你来说是件大事，值得认真对待。');
  if(revs>chosen.length/2) tips.push('<b>逆位偏多</b>：事情现在有点"堵"，多半卡在你自己的心态或做法上，先修内，别急。');
  else if(revs===0) tips.push('<b>全部正位</b>：能量很顺，可以大胆往前走。');
  const top=Object.entries(suitCount).sort((a,b)=>b[1]-a[1])[0];
  if(top&&top[1]>=2) tips.push('<b>「'+top[0]+'」偏多</b>：这次占卜的重点落在「'+SUIT_THEME[top[0]]+'」上，多从这个角度想。');
  if(spread.id==='decision') tips.push('<b>怎么选</b>：把A和B的前景对着看，重点比较两个"隐藏因素"——哪个更符合你真正想要的，而不是哪个看起来更轻松。');
  if(spread.id==='relationship') tips.push('<b>怎么看感情</b>：先看你俩的状态是否合拍，再看"隐藏障碍"有没有被忽略，最后看"走向"和"建议"是不是指向同一个方向。');
  if(spread.id==='celtic') tips.push('<b>怎么看这个大牌阵</b>：中间的十字讲"这件事本身"，右边的柱子讲"它会往哪走"，四周的牌讲"你和外界的处境"。');
  tips.push('<b>怎么读</b>：先看每张牌的关键词，再把它放进"所在位置"去理解——同一张牌在"障碍位"和"结果位"意思完全不同。');
  tips.push('<b>最后提醒</b>：塔罗照见的是当下的状态和倾向，不是定数。你的选择，永远能改变走向。');

  document.getElementById('summaryBox').innerHTML =
    '<div class="summary">'+
    '<h3>✦ 怎么读这个牌阵</h3>'+spread.guide+
    '<h3>✦ 逐位串一遍</h3><div class="chain">'+chain+'</div>'+
    '<h3>✦ 综合提示</h3>· '+tips.join('<br>· ')+
    '</div>';

  const q=document.getElementById('question').value.trim();
  document.getElementById('qDisplay2').textContent=q?('你的问题：'+q):'';
  go('screen-reading');
}

function restart(){document.getElementById('question').value='';startShuffle();}
renderSpreads();
</script>
</body>
</html>
